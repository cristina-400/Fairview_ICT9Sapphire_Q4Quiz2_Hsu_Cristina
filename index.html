<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz 2</title>
       <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> 
       <style>
         body {
            background-image: url(https://storage.googleapis.com/api4ai-static/rapidapi/tutorial_cbr_change_background/cbc3.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
        }

        p {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
        }

         .decorative-box{
            border: 2px solid #010;
            padding: 20px;
            width: 100%;
            margin: 20px auto;
            max-width: 1000px;
            background-color: mistyrose;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        img {
            display: inline-flex;

        }

        .flex-item {
            text-align: center;
        }

       </style>

        <br><br>

       <center>
        <h2><p style="color: #FFFFFF; font-family: monospace;">Score Analyzer</p></h2>
    </center>

     <div class="style detail">
       
        <div style="color: #FFFFFF;"><center><details ontoggle="message()">
            <summary>Click Me</summary>
            <i id="Show"></i>
        </details><br></center>
    </div>

 
<div class="container">
    <div class="decorative-box">
    <div class="row">
        <div class="col-md-4 text-center">
            <img src="https://i.pinimg.com/736x/4a/f3/a4/4af3a4e8654c7563043d1ddd17de7277.jpg" width="200" height="250">
            <br><br>
            <label for="SGrade">Science Grade</label>
            <input type="text" id="SGrade" name="SGrade" class="form-control">
        </div>

        <div class="col-md-4 text-center">
            <img src="https://i.pinimg.com/736x/d9/12/20/d91220de0458ef732ce4f24ff7502876.jpg" width="200" height="250">
            <br><br>
            <label for="MGrade">Math Grade </label>
            <input type="text" id="MGrade" name="MGrade" class="form-control">
        </div>

        <div class="col-md-4 text-center">
            <img src="https://i.pinimg.com/736x/65/50/02/655002266a34b32930e028f232d81023.jpg" width="200" height="250">
            <br><br>
            <label for="EGrade">English Grade</label>
            <input type="text" id="EGrade" name="EGrade" class="form-control">
        </div>
    </div>
    <br><br>

     <div class="button-grid2">
            <center>
                <button onclick="getGrading()" class="btn btn-warning">GET GRADING</button>
            </center>
        </div>
        <br>
    </div>
</div>
</form>
    <script>

            // Function to display a message when the details element is toggled
        function message() {
            document.getElementById("Show").innerHTML = "Complete name and Gmail";
        }

         function getGrading() {
            let SGrade = parseInt(document.getElementById("SGrade").value) || 0;
            let MGrade = parseInt(document.getElementById("MGrade").value) || 0;
            let EGrade = parseInt(document.getElementById("EGrade").value) || 0;

            let totalScore = (SGrade + MGrade + EGrade) / 3;
            let resultMessage = "";

             //Function to display the caculations of result
       switch (true) {
    case (totalScore >= 70 && totalScore <= 74):
        window.alert("Poor");
        break;
    case (totalScore >= 75 && totalScore <= 79):
        window.alert("Needs Improvement");
        break;
    case (totalScore >= 80 && totalScore <= 86):
        window.alert("Average");
        break;
    case (totalScore >= 87 && totalScore <= 93):
        window.alert("Above Satisfactory");
        break;
    case (totalScore >= 94 && totalScore <= 100):
        window.alert("Excellent");
        break;
    default:
        window.alert("Error");
}

       alert(`Here is your result of the score: ${resultMessage}`);
        }


    </script>

    </center>

</head>
